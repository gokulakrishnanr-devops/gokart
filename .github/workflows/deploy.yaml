name: GoCart CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  HELM_CHART_VERSION: 1.0.0-${{ github.sha }}
  TF_STATE_BUCKET: shopverse-terraform-state-v1

jobs:

  # ==========================================
  # STAGE 1: TEST
  # ==========================================
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download Go dependencies
        working-directory: ./backend
        run: go mod download

      - name: Run Go tests
        working-directory: ./backend
        run: go test ./...

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend ESLint
        working-directory: ./frontend
        run: npx eslint . --ext js,jsx --report-unused-disable-directives --max-warnings 0 --config .eslintrc.cjs

  # ==========================================
  # STAGE 2: SECURITY SCAN
  # ==========================================
  security-scan:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t gocart-frontend:scan ./frontend

      - name: Build backend image
        run: docker build -t gocart-backend:scan ./backend

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan frontend image
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            gocart-frontend:scan

      - name: Scan backend image
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            gocart-backend:scan
            
   # ──────────────────────────────────────────────
  # Stage 3: Build, Tag & Push Images + Helm Chart
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build, Tag & Push
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        run: |
          for repo in shopverse-frontend shopverse-backend shopverse-helmchart/shopverse; do
            aws ecr describe-repositories --repository-names $repo --region ${{ env.AWS_REGION }} 2>/dev/null || \
            aws ecr create-repository --repository-name $repo --region ${{ env.AWS_REGION }}
          done

      - name: Build and tag frontend image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/shopverse-frontend:${{ github.sha }} \
                        -t ${{ env.ECR_REGISTRY }}/shopverse-frontend:latest \
                        ./frontend

      - name: Build and tag backend image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/shopverse-backend:${{ github.sha }} \
                        -t ${{ env.ECR_REGISTRY }}/shopverse-backend:latest \
                        ./backend

      - name: Push frontend image
        run: |
          docker push ${{ env.ECR_REGISTRY }}/shopverse-frontend:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/shopverse-frontend:latest

      - name: Push backend image
        run: |
          docker push ${{ env.ECR_REGISTRY }}/shopverse-backend:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/shopverse-backend:latest

      - name: Update Helm values.yaml with new image tags
        run: |
          FRONTEND_IMG="${{ env.ECR_REGISTRY }}/shopverse-frontend:${{ github.sha }}"
          BACKEND_IMG="${{ env.ECR_REGISTRY }}/shopverse-backend:${{ github.sha }}"
          sed -i "s|image:.*# frontend-image|image: ${FRONTEND_IMG}  # frontend-image|" helm/shopverse/values.yaml
          sed -i "s|image:.*# backend-image|image: ${BACKEND_IMG}  # backend-image|" helm/shopverse/values.yaml
          echo "Updated values.yaml:"
          cat helm/shopverse/values.yaml

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Login Helm to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            helm registry login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Package Helm chart
        run: |
          helm package ./helm/shopverse \
            --version 1.0.0-${{ github.sha }} \
            --app-version ${{ github.sha }}

      - name: Push Helm chart to ECR
        run: |
          helm push shopverse-1.0.0-${{ github.sha }}.tgz \
            oci://${{ env.ECR_REGISTRY }}/shopverse-helmchart
 
  # ──────────────────────────────────────────────
  # STAGE 4: Deploy to Existing AWS EKS
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 1. Configure AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 2. Verify AWS identity
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 3. Verify existing EKS cluster
      - name: Check EKS cluster
        run: |
          aws eks describe-cluster \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "cluster.status" \
            --output text

      # 4. Install kubectl
      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      # 5. Install Helm
      - name: Install Helm
        uses: azure/setup-helm@v3

      # 6. Connect to EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      # 7. Verify Kubernetes connection
      - name: Verify Kubernetes connection
        run: |
          kubectl get nodes
          kubectl get namespaces

      # 8. Login to ECR
      - name: Login to ECR for Helm
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            helm registry login \
              --username AWS \
              --password-stdin ${{ env.ECR_REGISTRY }}

      # 9. Deploy application using Helm
      - name: Deploy Helm chart
        run: |
          helm upgrade --install shopverse \
            oci://${{ env.ECR_REGISTRY }}/shopverse-helmchart/shopverse \
            --version 1.0.0-${{ github.sha }} \
            --set frontend.image=${{ env.ECR_REGISTRY }}/shopverse-frontend:${{ github.sha }} \
            --set backend.image=${{ env.ECR_REGISTRY }}/shopverse-backend:${{ github.sha }} \
            --set-string mysql.rootPassword="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --set-string mysql.password="${{ secrets.MYSQL_PASSWORD }}" \
            --set-string jwtSecret="${{ secrets.JWT_SECRET }}" \
            --namespace shopverse \
            --create-namespace \
            --wait \
            --timeout 300s

      # 10. Diagnose deployment failures
      - name: Diagnose Kubernetes failure
        if: always()
        run: |
          echo "========== POD STATUS =========="
          kubectl get pods -n shopverse -o wide || true

          echo "========== DEPLOYMENTS =========="
          kubectl get deployments -n shopverse || true

          echo "========== STATEFULSETS =========="
          kubectl get statefulsets -n shopverse || true

          echo "========== SERVICES =========="
          kubectl get services -n shopverse || true

          echo "========== PVC STATUS =========="
          kubectl get pvc -n shopverse || true

          echo "========== EVENTS =========="
          kubectl get events -n shopverse --sort-by=.lastTimestamp || true

          echo "========== POD DESCRIPTIONS =========="
          kubectl describe pods -n shopverse || true

          echo "========== CONTAINER LOGS =========="
          for pod in $(kubectl get pods -n shopverse -o name); do
            echo "========== $pod =========="
            kubectl logs -n shopverse "$pod" \
              --all-containers=true --tail=80 || true
          done

      # 11. Verify successful deployment
      - name: Verify deployment
        if: success()
        run: |
          echo "========== NODES =========="
          kubectl get nodes -o wide

          echo "========== PODS =========="
          kubectl get pods -n shopverse

          echo "========== STATEFULSETS =========="
          kubectl get sts -n shopverse

          echo "========== SERVICES =========="
          kubectl get svc -n shopverse

          echo "========== PV & PVC =========="
          kubectl get pv,pvc -n shopverse

          echo "========== SECRETS =========="
          kubectl get secrets -n shopverse

          echo "========== INGRESS =========="
          kubectl get ingress -n shopverse || true
          kubectl get ingress -n shopverse || true
